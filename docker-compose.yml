services:
  mysql:
    image: mysql:8.2
    container_name: insurance
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: insuranceroot
      MYSQL_DATABASE: insurance
      MYSQL_USER: insurance
      MYSQL_PASSWORD: insurancepass
    volumes:
      - insurance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uinsurance", "-pinsurancepass"]

      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: insurance_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  insurance_mysql_data:
